name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Coverage raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml

  # Dockerfile'lar derleniyor mu? (Gönderme YOK, sadece kontrol.) Bozuk bir Dockerfile PR'da yakalansın,
  # yayın sırasında değil.
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: API imajı derlenir mi
        run: docker build -f src/Asistan.Api/Dockerfile -t api-kontrol .

      - name: Worker imajı derlenir mi
        run: docker build -f src/Asistan.Worker/Dockerfile -t worker-kontrol .
