name: CD

# CI (build + test) YEŞİL bitince main için çalışır. Kırmızı CI asla yayına çıkmaz.
# Elle de başlatılabilir (Actions sekmesi → CD → Run workflow).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN'a gereken en az yetki: kodu oku, paket (imaj) yaz.
permissions:
  contents: read
  packages: write

jobs:
  imaj:
    name: İmaj (${{ matrix.servis }})
    # CI başarısızsa hiç başlama
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - servis: api
            proje: Asistan.Api
          - servis: worker
            proje: Asistan.Worker
    steps:
      - name: Checkout (CI'ın test ettiği AYNI commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry'ye giriş
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # İmaj adı küçük harf olmak ZORUNDA; metadata-action bunu kendisi halleder.
      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aiasistan-${{ matrix.servis }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: İmajı derle ve gönder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.proje }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servis }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servis }}

  # Veritabanı şeması değiştiyse üretimde uygulanacak tek bir çalıştırılabilir dosya (migration bundle).
  migration-paketi:
    name: Migration paketi
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: dotnet-ef aracı
        run: dotnet tool restore
      - name: Bundle üret (linux-x64, self-contained)
        run: >
          dotnet ef migrations bundle
          -p src/Asistan.Infrastructure -s src/Asistan.Api
          --self-contained -r linux-x64 --force -o efbundle
      - uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: efbundle

  yayinla:
    name: Sunucuya yayınla
    needs: [imaj, migration-paketi]
    # GÜVENLİK DÜĞMESİ: Settings → Secrets and variables → Actions → Variables → DEPLOY_ENABLED=true
    # yapılmadıkça bu iş HİÇ çalışmaz (henüz sunucumuz yok).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # "production" ortamı: Settings → Environments'ta onay kuralı (reviewer) konabilir.
    environment: production
    steps:
      - name: İmaj adlarını küçük harfle hazırla
        run: |
          sahip="${GITHUB_REPOSITORY_OWNER,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "API_IMAGE=ghcr.io/${sahip}/aiasistan-api:${sha}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=ghcr.io/${sahip}/aiasistan-worker:${sha}" >> "$GITHUB_ENV"

      - name: Sunucuda yeni imajları çalıştır
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: API_IMAGE,WORKER_IMAGE
          script: |
            set -e
            cd /opt/aiasistan
            docker compose --profile uygulama pull api worker
            docker compose --profile uygulama up -d api worker
            docker image prune -f
